<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WHITESHADOW API — Powerful API documentation and endpoint tester for all WHITESHADOW services.">
    <meta name="theme-color" content="#1a202c">
    <title>WHITESHADOW API</title>
    <link rel="icon" href="/assets/icon.png" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    'mono': ['Ubuntu Mono', 'monospace'],
                    'sans': ['Inter', 'system-ui'],
                }
            }
        }
    }
</script>

<style>
    ::-webkit-scrollbar {
        display: none !important;
    }
    .glass {
        backdrop-filter: blur(16px) saturate(180%);
        background: rgba(23,25,35,0.85);
        border: 1px solid rgba(255,255,255,0.125);
    }
    .loader {
        width: 28px;
        height: 28px;
        border: 2px solid #4a5568;
        border-top: 2px solid #e2e8f0;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gradient-text {
        background: linear-gradient(135deg, #00e1ff 0%, #7a00ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
</style>
</head>

<body class="bg-gray-900 text-slate-300 font-mono min-h-screen antialiased">
<main class="max-w-2xl mx-auto px-8 py-16">

<!-- Header -->
<div class="text-left mb-8">
    <div class="flex items-center gap-4 mb-4">
        <img src="/assets/icon.png" class="w-12 md:w-9">
        <h1 class="text-3xl md:text-4xl font-bold gradient-text">WHITESHADOW API</h1>
    </div>

    <p class="text-slate-400 text-xs mx-auto mb-4">
        Welcome to WHITESHADOW API Docs.  
        Explore every endpoint, test them real-time, and integrate them into your apps.
    </p>
    
    <div class="text-xs space-y-1">
        <a href="https://wa.me/94704896880" target="_blank" class="text-slate-300 hover:text-white underline">
            Contact WHITESHADOW Support
        </a>
    </div>
</div>

<!-- Notifications -->
<div class="mb-8">
    <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold text-slate-300 flex items-center">
            <span class="material-icons mr-2 text-gray-400">notifications</span> Updates
        </h2>
        <span id="unread-count" class="text-xs bg-indigo-500/50 text-indigo-300 px-2 py-1 rounded-full hidden"></span>
    </div>
    <div id="notifications-list" class="space-y-2">
        <div class="loader"></div>
    </div>
</div>

<!-- Search -->
<div class="flex items-center justify-between mb-4">
    <div class="flex-1 relative">
        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
            <span class="material-icons text-gray-500">search</span>
        </div>
        <input
            type="text"
            id="searchInput"
            placeholder="Search WHITESHADOW endpoints..."
            class="w-full pl-12 pr-5 py-4 text-sm border bg-gray-800 border-gray-700 text-slate-300 placeholder-slate-500 focus:border-indigo-500"
        >
    </div>
</div>

<!-- Content -->
<div id="content" class="space-y-4">
    <div id="noResults" class="text-center py-16 hidden">
        <h3 class="text-xs text-slate-400 mb-2">No matching API found.</h3>
    </div>

    <div id="apiList" class="space-y-3"></div>
</div>

<!-- Footer -->
<footer class="mt-10">
    <p class="text-slate-400 text-xs mb-1">© 2025 WHITESHADOW</p>
    <p class="text-slate-400 text-xs">
        Inspired by: <a href="https://api.nekolabs.my.id/" target="_blank" class="underline">NekoLabs API</a>
    </p>
</footer>

</main>

<!-- Original JS (unchanged except branding) -->

<script>
function toggleCategory(index) {
    const category = document.getElementById(`category-${index}`);
    const icon = document.getElementById(`category-icon-${index}`);
    if (category.classList.contains('hidden')) {
        category.classList.remove('hidden');
        icon.textContent = 'expand_less';
    } else {
        category.classList.add('hidden');
        icon.textContent = 'expand_more';
    }
}

function toggleEndpoint(catIndex, endpointIndex) {
    const endpoint = document.getElementById(`endpoint-${catIndex}-${endpointIndex}`);
    const icon = document.getElementById(`endpoint-icon-${catIndex}-${endpointIndex}`);
    if (endpoint.classList.contains('hidden')) {
        endpoint.classList.remove('hidden');
        icon.textContent = 'expand_less';
    } else {
        endpoint.classList.add('hidden');
        icon.textContent = 'expand_more';
    }
}

async function executeRequest(event, catIndex, endpointIndex, method, path) {
    event.preventDefault();
    const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
    const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
    const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
    const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);

    const formData = new FormData(form);
    const params = new URLSearchParams();

    for (const [key, value] of formData.entries()) {
        if (value) params.append(key, value);
    }

    const fullPath = `${path}?${params.toString()}`;
    responseDiv.classList.remove('hidden');
    responseContent.innerHTML = '<div class="loader"></div>';

    try {
        const response = await fetch(fullPath);
        const contentType = response.headers.get("content-type");

        if (contentType && contentType.includes("application/json")) {
            const data = await response.json();
            responseContent.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        } else {
            const text = await response.text();
            responseContent.innerHTML = `<pre>${text}</pre>`;
        }
    } catch (error) {
        responseContent.innerHTML = `<pre>${error}</pre>`;
    }

    clearButton.classList.remove('hidden');
}

function clearResponse(catIndex, endpointIndex) {
    document.getElementById(`response-${catIndex}-${endpointIndex}`).classList.add('hidden');
    document.getElementById(`response-content-${catIndex}-${endpointIndex}`).innerHTML = '';
    document.getElementById(`clear-${catIndex}-${endpointIndex}`).classList.add('hidden');
}

async function loadApis() {
    const apiList = document.getElementById('apiList');

    try {
        const res = await fetch('/assets/settings.json');
        const data = await res.json();

        let html = '';

        data.categories.forEach((cat, i) => {
            html += `
            <div class="bg-gray-800 border border-gray-700">
                <button onclick="toggleCategory(${i})" class="w-full px-4 py-3 flex justify-between">
                    <span>${cat.name} (${cat.items.length})</span>
                    <span id="category-icon-${i}">expand_more</span>
                </button>
                <div id="category-${i}" class="hidden">
            `;

            cat.items.forEach((item, j) => {
                html += `
                <div class="border-t border-gray-700">
                    <button onclick="toggleEndpoint(${i}, ${j})" class="w-full px-4 py-2 flex justify-between">
                        <span>${item.path}</span>
                        <span id="endpoint-icon-${i}-${j}">expand_more</span>
                    </button>

                    <div id="endpoint-${i}-${j}" class="hidden p-3">
                        <form id="form-${i}-${j}" onsubmit="executeRequest(event, ${i}, ${j}, 'GET', '${item.path}')">
                            <button type="submit" class="bg-indigo-600 px-3 py-1 text-xs">Execute</button>
                            <button type="button" id="clear-${i}-${j}" onclick="clearResponse(${i}, ${j})" class="hidden ml-2 text-xs">Clear</button>
                        </form>

                        <div id="response-${i}-${j}" class="hidden mt-2">
                            <div id="response-content-${i}-${j}"></div>
                        </div>
                    </div>
                </div>
                `;
            });

            html += `</div></div>`;
        });

        apiList.innerHTML = html;

    } catch {
        apiList.innerHTML = '<p class="text-red-400 text-xs">Failed to load API</p>';
    }
}

async function loadNotifications() {
    const el = document.getElementById('notifications-list');

    try {
        const res = await fetch('/notifications.json');
        const data = await res.json();

        el.innerHTML = '';

        data.forEach(n => {
            el.innerHTML += `
                <div class="bg-gray-800 p-3 text-xs border border-gray-700">
                    <b>${n.title}</b><br>${n.message}
                </div>
            `;
        });

    } catch {
        el.innerHTML = '<p class="text-red-400 text-xs">Failed to load notifications</p>';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadApis();
    loadNotifications();
});
        </script>
</body>
</html>
